<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" role="img" aria-labelledby="title desc">
  <title id="title">OX owl logo</title>
  <desc id="desc">A friendly mascot owl with navy-and-orange palette alongside the OX wordmark.</desc>

  <!-- Owl mascot -->
  <g transform="translate(30, 10) scale(0.65)">
    <!-- Ears -->
    <path d="M68 65 L58 35 L80 55 Z" fill="#2e3e7a"/>
    <path d="M132 65 L142 35 L120 55 Z" fill="#2e3e7a"/>

    <!-- Body -->
    <ellipse cx="100" cy="110" rx="52" ry="58" fill="#1a2550"/>

    <!-- Belly -->
    <ellipse cx="100" cy="122" rx="32" ry="35" fill="#fef9f0"/>

    <!-- Belly chevrons -->
    <path d="M85 110 L100 118 L115 110" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M83 120 L100 129 L117 120" fill="none" stroke="#e8dcc8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Left eye -->
    <circle cx="82" cy="95" r="19" fill="#fef9f0"/>
    <circle cx="82" cy="95" r="19" fill="none" stroke="#f59e2b" stroke-width="3.5"/>
    <circle cx="82" cy="95" r="9" fill="#1a2550"/>
    <circle cx="79" cy="91" r="3.5" fill="#fff" opacity="0.9"/>

    <!-- Right eye -->
    <circle cx="118" cy="95" r="19" fill="#fef9f0"/>
    <circle cx="118" cy="95" r="19" fill="none" stroke="#f59e2b" stroke-width="3.5"/>
    <circle cx="118" cy="95" r="9" fill="#1a2550"/>
    <circle cx="115" cy="91" r="3.5" fill="#fff" opacity="0.9"/>

    <!-- Beak -->
    <path d="M95 107 L100 117 L105 107 Z" fill="#f59e2b"/>

    <!-- Wings -->
    <path d="M48 100 C43 115, 45 135, 54 148 L60 142 C55 130, 52 115, 53 103 Z" fill="#2e3e7a"/>
    <path d="M152 100 C157 115, 155 135, 146 148 L140 142 C145 130, 148 115, 147 103 Z" fill="#2e3e7a"/>

    <!-- Feet -->
    <g fill="#f59e2b">
      <path d="M80 165 L74 174 L79 172 L84 175 L89 172 L94 174 L88 165"/>
      <path d="M106 165 L100 174 L105 172 L110 175 L115 172 L120 174 L114 165"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="175" y="82" font-family="'Fredoka', 'Nunito', 'Quicksand', sans-serif" font-size="52" font-weight="700" fill="#1a2550" letter-spacing="3">OX</text>
  <rect x="175" y="95" width="140" height="3" rx="1.5" fill="#f59e2b"/>
  <text x="175" y="118" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#2e3e7a" letter-spacing="2.5">AI OPERATING LAYER</text>
</svg>
